
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Manga | Sennizhal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      background: #191919;
      border-bottom: 1px solid #333;
    }

    header a {
      color: white;
      text-decoration: none;
      font-size: 15px;
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
      color: #f0b429;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 18px 12px;
      text-align: center;
    }

    h1 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .notice {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .manga-page {
      width: 100%;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #202020;
      border: 1px solid #383838;
      margin: 12px 0;
      color: #aaa;
      padding: 20px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 24px 0;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 7px;
      background: #f0b429;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html">← Home</a>
    <span class="brand">Sennizhal</span>
    <a href="javascript:history.back()">Back</a>
  </header>

  <main>
    <h1 id="chapterTitle">Manga Reader</h1>
    <p class="notice">
      Your reading journey starts here.
    </p>

    <div id="pages"></div>

    <div class="controls">
      <button id="prevBtn" onclick="changePage(-1)">
        Previous
      </button>
      <button id="nextBtn" onclick="changePage(1)">
        Next
      </button>
    </div>

    <p id="pageNumber">Page 1 of 3</p>
  </main>

  <footer>
    © Sennizhal — Original Manga
  </footer>

  <script>
    const mangaPages = [
      "Manga page 1 will appear here.",
      "Manga page 2 will appear here.",
      "Manga page 3 will appear here."
    ];

    let currentPage = 0;

    function renderPage() {
      document.getElementById("pages").innerHTML =
        '<div class="manga-page">' +
        mangaPages[currentPage] +
        '</div>';

      document.getElementById("pageNumber").textContent =
        "Page " + (currentPage + 1) +
        " of " + mangaPages.length;

      document.getElementById("prevBtn").disabled =
        currentPage === 0;

      document.getElementById("nextBtn").disabled =
        currentPage === mangaPages.length - 1;
    }

    function changePage(direction) {
      currentPage += direction;

      if (currentPage < 0) currentPage = 0;
      if (currentPage >= mangaPages.length) {
        currentPage = mangaPages.length - 1;
      }

      renderPage();
    }

    renderPage();
  </script>
</body>
</html>
